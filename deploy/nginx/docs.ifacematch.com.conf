server {
    listen 80;
    server_name docs.ifacematch.com;

    return 301 https://docs.ifacematch.com$request_uri;
}

server {
    listen 443 ssl;
    server_name docs.ifacematch.com;

    ssl_certificate /etc/letsencrypt/live/docs.ifacematch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.ifacematch.com/privkey.pem;

    server_tokens off;
    client_max_body_size 64k;

    location = /healthz {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8091;
    }

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
    }
}
