name: Documentation CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
          cache: true
          cache-dependency-path: go.mod

      - name: Generate templ components
        run: go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate

      - name: Run unit and HTTP tests
        run: go test -mod=mod -race ./...

      - name: Vet Go code
        run: go vet -mod=mod ./...

      - name: Compile Linux binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -mod=mod -trimpath -ldflags='-s -w' \
            -o /tmp/ifacematch-docs ./cmd/docs
          /tmp/ifacematch-docs -version
